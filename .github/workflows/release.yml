name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild build \
            -project DockAnchor.xcodeproj \
            -scheme DockAnchor \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color

      - name: Package App
        run: |
          APP_PATH=$(find build/Build/Products/Release -name "DockAnchor.app" -maxdepth 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: DockAnchor.app not found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" DockAnchor.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DockAnchor ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: DockAnchor.zip
